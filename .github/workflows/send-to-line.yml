name: Send to Line

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'news/**.md'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get latest news file
        id: news
        run: |
          FILE=$(git diff --name-only HEAD~1 HEAD | grep 'news/' | head -1)
          if [ -z "$FILE" ]; then
            FILE=$(ls -t news/*.md 2>/dev/null | head -1)
          fi
          if [ -z "$FILE" ]; then
            echo "content=ไม่พบไฟล์ข่าวใหม่" >> $GITHUB_OUTPUT
            exit 0
          fi
          CONTENT=$(head -c 4500 "$FILE")
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Line Messaging API
        env:
          MESSAGE: ${{ steps.news.outputs.content }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          PAYLOAD=$(jq -n \
            --arg text "$MESSAGE" \
            --arg to "$LINE_USER_ID" \
            '{to: $to, messages: [{type: "text", text: $text}]}')
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ LINE API error"
            exit 1
          fi
          echo "✅ ส่งสำเร็จ"
